<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Volume Slider</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .container {
      text-align: center;
      max-width: 500px;
      padding: 24px;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    video {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #000;
    }

    .status-box {
      margin: 16px 0;
      padding: 12px;
      background: #334155;
      border-radius: 8px;
      font-size: 14px;
    }

    .meter-container {
      width: 100%;
      height: 20px;
      background: #475569;
      border-radius: 10px;
      overflow: hidden;
      margin: 16px 0;
    }

    .meter-fill {
      height: 100%;
      width: 50%;
      background: #38bdf8;
      transition: width 0.2s ease;
    }

    button {
      padding: 12px 24px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0ea5e9;
    }

    .shout-alert {
      color: #ef4444;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Yell-O-Vision</h2>
    <p>Voice commands: <strong>"louder"</strong>, <strong>"quieter"</strong>, <strong>"mute"</strong>, <strong>"max"</strong></p>

    <video id="player" loop playsinline>
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <div class="meter-container">
      <div class="meter-fill" id="volume-meter"></div>
    </div>

    <div class="status-box">
      <div>Current Volume: <span id="vol-text">50%</span></div>
      <div>Heard: <em id="speech-log">Nothing yet...</em></div>
      <div id="mic-level-label">Mic Energy: 0</div>
    </div>

    <button id="start-btn">Start Mic & Play</button>
  </div>

  <script>
    const video = document.getElementById('player');
    const startBtn = document.getElementById('start-btn');
    const meter = document.getElementById('volume-meter');
    const volText = document.getElementById('vol-text');
    const speechLog = document.getElementById('speech-log');
    const micLevelLabel = document.getElementById('mic-level-label');

    video.volume = 0.5;

    function updateVolumeDisplay() {
      const pct = Math.round(video.volume * 100);
      meter.style.width = pct + '%';
      volText.innerText = pct + '%';
    }

    async function initAudio() {
      // 1. Web Speech API Setup
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        alert('Web Speech API is not supported in this browser. Try Chrome.');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const lastResult = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
        speechLog.innerText = `"${lastResult}"`;

        if (lastResult.includes('louder') || lastResult.includes('up')) {
          video.volume = Math.min(1, video.volume + 0.2);
        } else if (lastResult.includes('quieter') || lastResult.includes('down') || lastResult.includes('quiet')) {
          video.volume = Math.max(0, video.volume - 0.2);
        } else if (lastResult.includes('mute') || lastResult.includes('shut up')) {
          video.volume = 0;
        } else if (lastResult.includes('max') || lastResult.includes('full')) {
          video.volume = 1;
        }
        updateVolumeDisplay();
      };

      // Restart automatically if recognition drops
      recognition.onend = () => recognition.start();
      recognition.start();

      // 2. Audio Level Detection (Over-the-top spike detector)
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioContext.createMediaStreamSource(stream);
      const analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);

      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function detectScreaming() {
        analyser.getByteFrequencyData(dataArray);
        
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        const average = sum / dataArray.length;
        micLevelLabel.innerText = `Mic Energy: ${Math.round(average)}`;

        // Chaos trigger: If user shouts too loudly, force volume to 100%
        if (average > 80) {
          video.volume = 1;
          updateVolumeDisplay();
          speechLog.innerHTML = '<span class="shout-alert">MAX SPIKE TRIGGERED BY SHOUT!</span>';
        }

        requestAnimationFrame(detectScreaming);
      }

      detectScreaming();
    }

    startBtn.addEventListener('click', async () => {
      try {
        await initAudio();
        video.play();
        startBtn.style.display = 'none';
      } catch (err) {
        console.error(err);
        alert('Could not access microphone: ' + err.message);
      }
    });
  </script>
</body>
</html>
